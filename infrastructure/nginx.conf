# ── SafeMAPS Nginx Configuration ─────────────────────────────────────
# Serves the Vite frontend build and proxies /api/* to the backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not cache the files that point browsers at the current hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # ── Proxy /api to the FastAPI backend ────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── AI Demo chat — Server-Sent Events, needs its own proxy rules ──
    # The agent can take several tool round-trips per turn (up to
    # ai_max_tool_iterations, each up to ai_request_timeout_seconds), so
    # the generic 60s /api/ read timeout above is too short and would cut
    # a legitimate multi-tool answer off mid-stream. proxy_buffering must
    # also be off, or nginx waits for the whole response before sending
    # anything to the browser — which defeats the entire point of the
    # live tool-call cards (PRD §11): they'd appear to hang, then dump
    # everything at once instead of streaming in real time.
    location /api/ai/chat {
        proxy_pass         http://backend:8000/api/ai/chat;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # ── Proxy /health to the FastAPI backend ─────────────────────────
    location /health {
        proxy_pass         http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── SPA fallback — all other paths serve index.html ──────────────
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
